name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test
      - run: npm run build

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    env:
      PREVIEW_URL: https://jobtology-${{ github.event.pull_request.number }}.test.yeongmin.net

    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Wait for Coolify preview endpoint
        run: |
          echo "Waiting for $PREVIEW_URL"

          for i in {1..60}; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$PREVIEW_URL/health" > /dev/null; then
              echo "Preview is ready!"
              exit 0
            fi

            echo "Not ready yet..."
            sleep 5
          done

          echo "Preview failed to become ready"
          exit 1

      - name: Run integration tests
        run: npm run test:integration
        env:
          BASE_URL: ${{ env.PREVIEW_URL }}
